worker_processes auto;
events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    server {
        listen 80;
        server_name _;

        root /var/www/static;
        index index.html;

        location ^~ /icons/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location = /favicon.ico {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location = /manifest.webmanifest {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location ~* \.(?:css|js|svg|woff2?|png|jpg|jpeg|gif|ico)$ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

