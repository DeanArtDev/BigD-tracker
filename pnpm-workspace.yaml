packages:
  - 'apps/*'
  - 'clients/*'
  - 'libs/*'
  - 'configs/**'
allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

overrides:
  '@radix-ui/react-dismissable-layer': '1.1.19'
  # Keep every transitive query-string parser on a patched release.
  'qs': '6.15.3'
  # Security overrides for transitive packages pinned by upstream dependencies.
  'postcss': '8.5.23'
  'sharp': '0.35.0'
  'ws': '8.21.0'

catalog:
  'rxjs': '^7.8.1'
  '@nestjs/common': '^11.1.29'
  '@nestjs/core': '^11.1.29'
  '@nestjs/config': '^4.0.2'
  '@nestjs/apollo': '13.4.4'
  '@nestjs/graphql': '13.4.4'
  '@nestjs/jwt': '^11.0.0'
  '@nestjs/passport': '^11.0.5'
  '@nestjs/platform-express': '^11.1.29'
  '@nestjs/cli': '^11.0.7'
  '@nestjs/schematics': '^11.0.0'
  '@nestjs/testing': '^11.1.29'
  '@nestjs/swagger': '^11.4.6'
  '@nestjs/cqrs': '^11.0.3'
  'amqp-connection-manager': '^4.1.14'
  'amqplib': '^0.10.8'
  '@nestjs/microservices': '^11.1.29'
  '@nestjs/schedule': '^6.0.0'

  'typescript-eslint': '^8.30.1'
  '@types/lodash': '^4.17.25'
  '@types/lodash-es': '^4.17.12'
  '@types/node': '^22.20.1'
  '@types/react': '^19'
  '@types/react-dom': '^19'
  '@types/pg': '^8.21.0'
  '@types/validator': '^13.15.10'
  '@types/express': '^5.0.6'
  '@types/qs': '^6.15.1'
  'typescript-transform-paths': '^3.5.6'

  'ts-loader': '^9.5.2'
  'ts-node': '^10.9.2'
  'dotenv': '^16.5.0'
  'reflect-metadata': '^0.2.2'
  'express': '^5.0.1'
  'globals': '^16.0.0'
  'validator': '^13.15.23'
  'lodash': '^4.17.21'
  'lodash-es': '^4.17.21'

  'date-fns': '^4.1.0'
