tracker-client:deploy:dev:
  extends: .client-deploy-template
  before_script:
    - !reference [.client-deploy-template, before_script]
    - envsubst < sources/docker-compose.clients-temp.yml > docker-compose.yml

  variables:
    DEPLOY_HOST: '$DEV_STAGE_HOST'
    DEPLOY_USER: '$DEV_STAGE_DEPLOY_USER'
    REMOTE_DIR: '$DEV_STAGE_REMOTE_DIR'

api-gateway:deploy:
  stage: deploy-dev-stage
  when: manual
  image: alpine:3.20
  needs:
    - job: api-gateway:build
      optional: false

  tags: [registry, dind]

  variables:
    DEPLOY_HOST: '192.168.0.89'
    DEPLOY_USER: 'deployer'
