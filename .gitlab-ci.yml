api-gateway:deploy:dev:
  stage: deploy-dev-stage
  when: manual
  extends: .app-deploy-template
  needs:
    - job: api-gateway:build
      optional: false

  before_script:
    - !reference [.app-deploy-template, before_script]
    - ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "rm -f ${REMOTE_DIR}/public.pem"
    - scp "$AUTH_PUBLIC_KEY_DEV" "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/public.pem"
    - envsubst '${CI_REGISTRY_IMAGE} ${CI_COMMIT_SHORT_SHA}' < sources/docker-compose.api-gateway.yml > docker-compose.yml

  variables:
    ENV: '$API_GATEWAY_ENV'
    DEPLOY_HOST: '$DEV_STAGE_HOST'
    DEPLOY_USER: '$DEV_STAGE_DEPLOY_USER'
    REMOTE_DIR: '$DEV_STAGE_REMOTE_APP_DIR/api-gateway'

