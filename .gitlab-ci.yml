    - ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "rm -f ${REMOTE_DIR}/private.pem"
    - scp "$AUTH_PRIVATE_KEY_DEV" "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/private.pem"
    - envsubst '${CI_REGISTRY_IMAGE} ${CI_COMMIT_SHORT_SHA}' < sources/docker-compose.auth-service.yml > docker-compose.yml

