include:
  - local: ci/install-environment.yml

image: node:24.13
stages:
  - monorepo
  - docker-build
  - deploy-dev-stage

.ssh-prepare: &ssh-prepare
  - apk add --no-cache openssh-client gettext bash
  - eval "$(ssh-agent -s)"
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa
  - ssh-keyscan -H $SSH_KNOWN_HOSTS > ~/.ssh/known_hosts
  - chmod 644 ~/.ssh/known_hosts
  - ssh-add ~/.ssh/id_rsa

.client-deploy-template:
  image: alpine:3.20
  tags: [registry, dind]

  before_script:
    - *ssh-prepare

  script:
    - ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "rm -f ${REMOTE_DIR}/docker-compose.yml"
    - ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "touch ${REMOTE_DIR}/docker-compose.yml"
    - scp docker-compose.yml "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/docker-compose.yml"
    - |
      ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "
        set -euo pipefail
        cd ${REMOTE_DIR}
        echo '${CI_REGISTRY_PASSWORD}' | docker login '${CI_REGISTRY}' -u '${CI_REGISTRY_USER}' --password-stdin
        docker compose -f docker-compose.yml pull
        docker compose -f docker-compose.yml up -d
      "

lint:
  interruptible: true
  stage: monorepo
  tags: [docker]
  extends: .install_environment
  script:
    - pnpm run format:all
    - pnpm run lint:all

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

test:
  interruptible: true
  stage: monorepo
  tags: [docker]
  extends: .install_environment
  script:
    - pnpm run test:all

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

# ======================== BUILD ===============================

tracker-client:build:
  stage: docker-build
  when: manual
  image: docker:27.4.1-cli
  needs:
    - job: lint
      optional: false
    - job: test
      optional: false

  services:
    - name: docker:27.4.1-dind
      alias: docker
      command: ['--tls=false']
  tags: [registry, dind]

  before_script:
    - apk add --no-cache git git-lfs
    - git lfs install
    - git lfs pull

  variables:
    DOCKER_HOST: 'tcp://docker:2375'
    DOCKER_TLS_CERTDIR: ''

  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

    - IMAGE_REF="${CI_REGISTRY_IMAGE}:tracker-client-sha-${CI_COMMIT_SHORT_SHA}"

    - |
      docker build \
        -f ./clients/tracker-client/Dockerfile \
        --build-arg VITE_API_BASE_URL="$TRACKER_CLIENT_API_URL" \
        --build-arg HUSKY="0" \
        -t "$IMAGE_REF" \
        .

    - docker push "$IMAGE_REF"

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

