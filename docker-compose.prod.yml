  tracker_db:
    platform: linux/amd64
    profiles: [ 'prod' ]
    image: postgres:15
    env_file:
      - .env
    container_name: tracker_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
      interval: 1s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - tracker_net

  tracker_client:
    platform: linux/amd64
    container_name: tracker_client
    image: tracker_client_image:lts
    ports:
      - ${VITE_CLIENT_PORT}:80
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./clients/tracker-client/Dockerfile
      args:
        VITE_CLIENT_PORT: ${VITE_CLIENT_PORT:-3000}
        VITE_BASE_API_URL: ${VITE_BASE_API_URL:-/api}
        HUSKY: 0

volumes:
  rabbitmq_data:
    name: rabbitmq_data
  db_data:
    name: tracker_db_data

networks:
  tracker_net:
    name: tracker_net