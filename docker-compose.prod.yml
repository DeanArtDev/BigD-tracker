services:
  rabbitmq:
    profiles: [ 'prod' ]
    platform: linux/amd64
    image: rabbitmq:4.1.1-management
    container_name: rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - RABBITMQ_DEFAULT_USER=${RMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RMQ_PASSWORD}
    env_file:
      - .env
    ports:
      - "${RMQ_PORT}:${RMQ_PORT}"
      - "${RMQ_MANAGER_PORT}:${RMQ_MANAGER_PORT}"
    networks:
      - tracker_net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  account_service:
    platform: linux/amd64
    profiles: [ 'prod' ]
    container_name: account_service
    image: account_service_image:lts
    depends_on:
      rabbitmq:
        condition: service_healthy
      tracker_db:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./apps/account-service/Dockerfile
    env_file:
      - .env
    ports:
      - ${ACCOUNT_SERVICE_PORT}:${ACCOUNT_SERVICE_PORT}
    networks:
      - tracker_net

