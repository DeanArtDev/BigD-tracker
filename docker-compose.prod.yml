services:
  account_service:
    platform: linux/amd64
    profiles: ['prod']
    container_name: account_service
    image: account_service_image:lts
    depends_on:
      rabbitmq:
        condition: service_healthy
      tracker_db:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./apps/account-service/Dockerfile
    env_file:
      - .env
    environment:
      API_PORT: ${ACCOUNT_SERVICE_PORT}
    ports:
      - ${ACCOUNT_SERVICE_PORT}:${ACCOUNT_SERVICE_PORT}
    networks:
      - tracker_net

  training_service:
    platform: linux/amd64
    profiles: ['prod']
    container_name: training_service
    image: training_service_image:lts
    depends_on:
      rabbitmq:
        condition: service_healthy
      tracker_db:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./apps/training-service/Dockerfile
    environment:
      API_PORT: ${TRAINING_SERVICE_PORT}
    env_file:
      - .env
    ports:
      - ${TRAINING_SERVICE_PORT}:${TRAINING_SERVICE_PORT}
    networks:
      - tracker_net

  goal_service:
    platform: linux/amd64
    profiles: [ 'prod' ]
    container_name: goal_service
    image: goal_service_image:lts
    depends_on:
      rabbitmq:
        condition: service_healthy
      tracker_db:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./apps/goal-service/Dockerfile
    environment:
      API_PORT: ${GOAL_SERVICE_PORT}
    env_file:
      - .env
    ports:
      - ${GOAL_SERVICE_PORT}:${GOAL_SERVICE_PORT}
    networks:
      - tracker_net

  api_gateway:
    platform: linux/amd64
    profiles: ['prod']
    container_name: api_gateway
    image: api_gateway_image:lts
    depends_on:
      rabbitmq:
        condition: service_healthy
      tracker_db:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    env_file:
      - .env
    environment:
      API_PORT: ${API_GATEWAY_PORT}
    ports:
      - ${API_GATEWAY_PORT}:${API_GATEWAY_PORT}
    volumes:
      - ./apps/api-gateway/db/dumps:/db-dumps
    networks:
      - tracker_net

  tracker_client:
    platform: linux/amd64
    container_name: tracker_client
    image: tracker_client_image:lts
    ports:
      - ${VITE_CLIENT_PORT}:80
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./clients/tracker-client/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        HUSKY: 0

  tracker_db:
    platform: linux/amd64
    profiles: ['prod', 'migrations']
    image: postgres:17.5
    env_file:
      - .env
    container_name: tracker_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 1s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - tracker_net

  rabbitmq:
    profiles: ['prod']
    platform: linux/amd64
    image: rabbitmq:4.1.1-management
    container_name: rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - RABBITMQ_DEFAULT_USER=${RMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RMQ_PASSWORD}
    env_file:
      - .env
    ports:
      - '${RMQ_PORT}:${RMQ_PORT}'
      - '${RMQ_MANAGER_PORT}:${RMQ_MANAGER_PORT}'
    networks:
      - tracker_net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
    name: rabbitmq_data
  db_data:
    name: tracker_db_data

networks:
  tracker_net:
    name: tracker_net
